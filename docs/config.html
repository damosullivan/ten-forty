<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ten Forty</title><style>body{background:#111;color:#eee;font:15px/1.4 -apple-system,Roboto,sans-serif;margin:0;padding:18px}h1{font-size:17px;font-weight:600;margin:0 0 18px}label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8a8a92;margin:16px 0 6px}select{width:100%;padding:10px;font-size:15px;background:#1e1e22;color:#eee;border:1px solid #333;border-radius:6px}button{width:100%;margin-top:26px;padding:14px;font-size:15px;font-weight:600;background:#eee;color:#111;border:0;border-radius:6px}</style></head><body><h1>Ten Forty</h1><label>Theme</label><select id="Theme"><option value="0">White on black</option><option value="1">Black on white</option></select><label>Time alignment</label><select id="Align"><option value="0">Left</option><option value="1">Centre</option><option value="2">Right</option></select><label>Date alignment</label><select id="DateAlign"><option value="0">Left</option><option value="1">Centre</option><option value="2">Right</option></select><label>Date format</label><select id="DateFormat"><option value="0">Tue 10</option><option value="1">10 Nov</option><option value="2">Tue 10 Nov</option><option value="3">Tuesday</option></select><label>Date</label><select id="DatePos"><option value="0">Hidden</option><option value="1">Top</option><option value="2">Bottom</option></select><label>Single-digit minutes</label><select id="OhWords"><option value="1">Seven oh five</option><option value="0">Seven five</option></select><label>Font weight</label><select id="Weight"><option value="0">Light</option><option value="1">Regular</option></select><label>Letter case</label><select id="Case"><option value="0">lowercase</option><option value="1">UPPERCASE</option><option value="2">Capital</option></select><label>Transition</label><select id="Transition"><option value="2">Slide the hour only</option><option value="1">Slide every row</option><option value="0">No animation</option></select><button id="save">Save</button><script>var o=JSON.parse(decodeURIComponent((location.hash||location.search).slice(1))||"{}");var D={"Theme":0,"Align":0,"DateAlign":1,"DateFormat":0,"DatePos":2,"OhWords":1,"Weight":0,"Case":0,"Transition":2};var K=["Theme","Align","DateAlign","DateFormat","DatePos","OhWords","Weight","Case","Transition"];var m=(o._maxDate===undefined)?3:o._maxDate;var df=document.getElementById("DateFormat");for(var i=df.options.length-1;i>=0;i--){  if(parseInt(df.options[i].value,10)>m)df.removeChild(df.options[i]);}K.forEach(function(k){  var e=document.getElementById(k);  e.value=String(o[k]===undefined?D[k]:o[k]);  if(!e.value)e.value=String(D[k]);});document.getElementById("save").addEventListener("click",function(){  var out={};  K.forEach(function(k){    out[k]=parseInt(document.getElementById(k).value,10);  });  document.location="pebblejs://close#"+encodeURIComponent(JSON.stringify(out));});</script></body></html>
